# Capture — Slack to Triage in one step.
#
# A Slack workflow (reacji or shortcut on a message in #carinya-content)
# posts a repository_dispatch event with the message text and author.
# Nothing is interpreted, expanded or prioritised on the way through.
#
#   curl -X POST https://api.github.com/repos/carinyaparc/carinyaparc/dispatches \
#     -H "Authorization: Bearer $GH_TOKEN" \
#     -d '{"event_type":"capture","client_payload":{"text":"<verbatim>","author":"jonno"}}'
name: content-capture

on:
  repository_dispatch:
    types: [capture]
  workflow_dispatch:
    inputs:
      text:
        description: The idea, verbatim
        required: true
      author:
        description: Who had it
        required: true

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: File to Triage, raw text preserved
        env:
          CAPTURE_TEXT: ${{ github.event.client_payload.text || inputs.text }}
          CAPTURE_AUTHOR: ${{ github.event.client_payload.author || inputs.author }}
        run: pnpm tsx scripts/capture/capture.ts

      - name: Commit
        run: |
          if [[ -n "$(git status --porcelain .agency/triage)" ]]; then
            git config user.name "content-capture"
            git config user.email "agents@carinyaparc.com.au"
            git add .agency/triage
            git commit -m "capture: idea to Triage"
            git push
          fi
