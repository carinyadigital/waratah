# content-monitor — weekly corpus invariants.
# Deterministic, no model calls. Violations are filed into Triage under
# .agency/triage/ with idempotencyKey invariant.id+page and pushed as a
# commit; a Linear sync picks them up from there.
name: content-monitor

on:
  schedule:
    # 0 5 * * SUN Australia/Sydney ≈ 19:00 Saturday UTC
    - cron: '0 19 * * SAT'
  push:
    branches: [main]
    paths:
      - 'packages/brand/**' # positioning change → immediate re-check
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build brand dist
        run: pnpm build:brand

      - name: Run invariants
        env:
          PAYLOAD_URL: ${{ secrets.PAYLOAD_URL }}
          CONTENT_AGENT_API_KEY: ${{ secrets.CONTENT_AGENT_API_KEY }}
        run: pnpm monitor --external-links check

      - name: Expiry sweep — stale briefs out of the ready queue
        run: pnpm tsx scripts/capture/expiry-sweep.ts

      - name: Commit filed triage items
        run: |
          if [[ -n "$(git status --porcelain .agency)" ]]; then
            git config user.name "content-monitor"
            git config user.email "agents@carinyaparc.com.au"
            git add .agency
            git commit -m "content-monitor: file invariant violations / expire stale briefs"
            git push
          else
            echo "no new violations"
          fi
