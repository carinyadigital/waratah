# content-qa — the deterministic gate agent.
#
# Two jobs, one suite:
#   - pull_request: gates + access assertions on the PR, with a per-gate PR
#     comment that updates in place.
#   - push to main: the same suite re-run on the merge commit. A gate that
#     only runs pre-merge can be routed around by force-push or admin merge;
#     this one cannot be skipped. Branch protection must require this check.
#
# No model calls anywhere in this workflow.
name: content-qa

on:
  pull_request:
    paths:
      - '.agency/content/**'
      - 'packages/brand/**'
      - 'packages/content-pipeline/**'
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/content-qa.yml'
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  gates:
    name: gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build brand dist
        run: pnpm build:brand

      - name: Run the gate suite
        id: gates
        continue-on-error: true # job verdict is delivered by the last step, after the report is posted
        run: |
          pnpm gates --format markdown --out gate-report.md
        # external links are checked for real here — that is the point of CI

      - name: Access assertions
        if: always()
        run: pnpm vitest run tests/access

      - name: Gate report as PR comment
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- content-qa-report -->';
            let body;
            try {
              body = fs.readFileSync('gate-report.md', 'utf8');
            } catch {
              body = `${marker}\n## Content QA\n\nGate run failed before producing a report — see the workflow logs.`;
            }
            if (!body.includes(marker)) body = `${marker}\n${body}`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Fail the workflow if gates failed
        if: steps.gates.outcome == 'failure'
        run: exit 1
