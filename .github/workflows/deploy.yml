name: deploy

on:
  workflow_dispatch:
    inputs:
      provider:
        # cursor renders but has no publisher — deploy refuses it explicitly.
        description: Provider to deploy to
        required: true
        default: claude
        type: choice
        options: [claude]
      dry-run:
        description: Render and report without publishing
        required: false
        default: true
        type: boolean

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.provider }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Refuses to deploy anything that does not match the committed artifact,
      # so what ships is always what was reviewed.
      - name: Built output matches the repo
        run: pnpm build:check

      # Placeholders in dist/ resolve here and nowhere else. A dry run needs
      # none of them: it reports which are missing instead of failing.
      - name: Deploy
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANALYTICS_MCP_URL: ${{ secrets.ANALYTICS_MCP_URL }}
          CLAUDE_ENVIRONMENT_ID: ${{ secrets.CLAUDE_ENVIRONMENT_ID }}
          VAULT_ID_CONTENT_MARKETING: ${{ secrets.VAULT_ID_CONTENT_MARKETING }}
        run: pnpm run deploy -- --provider ${{ inputs.provider }} ${{ inputs.dry-run && '--dry-run' || '' }}
