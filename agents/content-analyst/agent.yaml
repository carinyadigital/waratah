# Identity, model tier, permissions, and per-target overlay.
#
# Connectors, schedules, tools and skills are discovered from the directories
# beside this file. Adding one is adding a file, never editing a list here.
#
#   instructions.md      system prompt
#   questions.yaml       pre-registered questions, read at runtime
#   connectors/*.yaml    one MCP server per file
#   schedules/*.yaml     one run per file

schema: v1
name: content-analyst
description: >-
  Answers pre-registered performance questions from analytics and emits one read
  with the arithmetic showing. Reads only: it holds no write credential to
  anything it reports on.

instructions: ./instructions.md

# A tier, not a model id. Each target resolves it and records what it resolved
# to, so `strong` never hides what was deployed.
model: strong

permissions:
  # Anything not named here needs a human.
  default: ask
  connectors:
    analytics: allow

providers:
  claude:
    mode: managed
  cursor:
    scope: private
    memory: false
