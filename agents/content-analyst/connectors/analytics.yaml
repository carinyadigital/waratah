name: analytics
description: >-
  Google Analytics 4, read-only. Sessions, conversions and audience breakdowns
  for the pre-registered questions.
vendor: google-analytics
readOnly: true

# The official Google MCP server (googleanalytics/google-analytics-mcp) ships as
# a local stdio process. A managed agent needs a URL, so it has to be hosted:
# deploy it to Cloudflare Workers and put that endpoint in ANALYTICS_MCP_URL.
#
# The placeholder stays literal in dist/. Deploy resolves it, so no endpoint or
# token is ever committed.
transport:
  type: url
  url: ${ANALYTICS_MCP_URL}
