# Pre-registered questions — asked BEFORE looking.
#
# The analyst may only write findings against questions listed here. "Find
# insights in GA4" is a story generator; these are analysis. Changing this
# file is a reviewed diff, which is the point: questions are chosen by a
# human on the quarterly/monthly clock, not invented per run after seeing
# the data. Exploratory findings are permitted but labelled, and carry no
# recommendation alone.
questions:
  - id: q1
    question: Did net new email subscribers change week over week, and which cluster drove it?
  - id: q2
    question: Did recipe-cluster subscriber conversion (subscribers per unique reader) move against its 8-week baseline?
  - id: q3
    question: Which practitioner-cluster pages lost organic clicks against their 8-week baseline?
  - id: q4
    question: Did the 30-day engaged open rate or unsubscribe rate move outside their guardrail bands?
  - id: q5
    question: Are any pages decaying — impressions steady, clicks falling — in a way that suggests a refresh beats a new piece?
