# Lead identity, model tier, permissions, and the roster it coordinates.
#
# The roster's names and version pins live here because a subagent directory
# name alone carries no version; everything else about a subagent — its
# instructions, connectors, model tier — is discovered from
# subagents/<name>/, same as connectors/ and schedules/ are discovered for
# this agent itself.

schema: v1
name: content-marketer
description: >-
  Runs content discovery: dispatches content-analyst and market-researcher,
  synthesises opportunities against their findings, and writes them to the
  backlog. Holds no connector but the backlog, so it cannot reach analytics,
  the web, or media directly even if its reasoning goes sideways.

instructions: ./instructions.md

model: strong

permissions:
  default: ask
  connectors:
    backlog: allow

multiagent:
  type: coordinator
  agents:
    - name: content-analyst
      version: 1
    - name: market-researcher
      version: 1

providers:
  claude:
    mode: managed
    # MCP credentials are session-scoped and supplied by vault. Linear
    # authenticates per session over OAuth, so without this the backlog
    # connection is attempted unauthenticated and fails at runtime — after
    # the session has already started.
    vaults: [content-marketing]
  # No cursor block: cursor cannot express a coordinator roster
  # (assertSupported refuses it). Declaring nothing here means the build
  # skips cursor for this agent entirely rather than emitting a roster-less,
  # degraded artifact under a provider that never had the concept.
