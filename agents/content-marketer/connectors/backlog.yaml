name: backlog
description: >-
  Linear, read-write. Where discovered opportunities are written and where
  their status is tracked. The lead's only connector — MCP servers are
  agent-scoped, so declaring nothing else means it cannot reach analytics,
  the web, or media directly even if its reasoning goes sideways. It has to
  ask.
vendor: linear
readOnly: false

# Linear's official hosted remote MCP server. Authenticates per-session via
# OAuth — there is no token to place in this URL or to commit to dist/.
# Authorise the connection separately (connector settings / `claude mcp`)
# before this agent's first real run.
transport:
  type: url
  url: https://mcp.linear.app/mcp
