name: web-research
description: >-
  Web search and page fetch, read-only. Competitor sites, category news and
  regulatory sources for market-researcher's report.
vendor: exa
readOnly: true

# Exa's hosted remote MCP server. No key needed on the free (rate-limited)
# plan; a production key would ride in a request header, which this
# transport shape has no field for yet — literal URL is enough for now.
transport:
  type: url
  url: https://mcp.exa.ai/mcp
