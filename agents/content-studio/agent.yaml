# yaml-language-server: $schema=../../packages/agent-manifest/agent.schema.json
version: 2
name: content-studio
team: content
owner: jonno
description: Track two production. Turns a brief and pack into a staged CMS draft with annotated claims. Cannot publish, cannot send, cannot touch a database.
tags: [production]

capability:
  kind: conversational
  model: strong
  workflow: produce

policy:
  untrustedInput: true
  connections: [cms, code, chat]
  writes: [cms-draft, repo-branch, chat]
  approval: pr-review
  spendCapUsd: 40
  idempotencyKey: brief.slug
  cmsRole: agent

bindings:
  - provider: claude
    mode: managed

triggers:
  - type: chat
    channel: chat
  - type: manual

observability:
  traces: both
  alertChannel: '#carinya-content'
  evals: ./evals
