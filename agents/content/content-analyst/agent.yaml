# yaml-language-server: $schema=../../../packages/agent-manifest/agent.schema.json
version: 2
name: content-analyst
team: content
owner: jonno
description: Track one intelligence. Reads performance and audience signals, emits read and demand artifacts. No CMS, no repo, no send.
tags: [intelligence]

capability:
  kind: conversational
  model: strong
  workflow: sense

policy:
  untrustedInput: true
  connections: [analytics, search, seo, esp, chat]
  writes: [artifact-store, tracker, chat]
  approval: draft-only
  spendCapUsd: 60
  idempotencyKey: read.period

extensions:
  content:
    nThreshold: { analytics: 400, search: 200, seo: 100, esp: 150 }
    clusters: [topic-area, angle-type, format, funnel-intent]
    emits: [read, demand]

bindings:
  - provider: claude
    mode: managed
    schedule: '0 7 * * MON'
    timezone: Australia/Sydney

triggers:
  - type: schedule
    cron: '0 7 * * MON'
    timezone: Australia/Sydney
  - type: chat
    channel: chat

observability:
  traces: both
  alertChannel: '#carinya-content'
  evals: ./evals
