# yaml-language-server: $schema=../../../packages/agent-manifest/agent.schema.json
version: 2
name: content-desk
team: content
owner: jonno
description: Interactive desk surface for quarterly market research and positioning review. Human-driven, no deployment, proposes diffs a human merges.
tags: [research]

capability:
  kind: interactive
  model: strong
  workflow: intake

policy:
  untrustedInput: true
  connections: [chat]
  writes: [artifact-store, tracker]
  approval: draft-only
  idempotencyKey: landscape.period

extensions:
  content:
    emits: [landscape]

bindings:
  - provider: claude
    mode: subagent

triggers:
  - type: manual

observability:
  traces: none
  alertChannel: '#carinya-content'
