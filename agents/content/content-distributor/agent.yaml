# yaml-language-server: $schema=../../../packages/agent-manifest/agent.schema.json
version: 2
name: content-distributor
team: content
owner: jonno
description: Adapts published work per surface and drafts sends. The only agent that can reach an audience; every send is approved by a human, per send.
tags: [distribution]

capability:
  kind: conversational
  model: standard
  workflow: act

policy:
  untrustedInput: true
  connections: [esp, chat]
  writes: [artifact-store, tracker, chat, email-send, social-post]
  approval: human
  spendCapUsd: 20
  idempotencyKey: send.id

bindings:
  - provider: claude
    mode: managed

triggers:
  - type: chat
    channel: chat
  - type: manual

observability:
  traces: both
  alertChannel: '#carinya-content'
  evals: ./evals
