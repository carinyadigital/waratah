# Content workflow shape. Steps map to agents under this team directory.
workflow: content
artifacts: ./artifacts
steps:
  - id: intake
    agent: content-desk
    emits: [landscape]
  - id: sense
    agent: content-analyst
    emits: [read, demand]
  - id: commission
    agent: content-planner
    emits: [opportunities, brief]
  - id: produce
    agent: content-studio
    emits: [pack, draft]
    gates: content-suite
  - id: verify
    agent: content-qa
    gates: content-suite
    approval: pr-review
  - id: act
    agent: content-distributor
    approval: human
  - id: observe
    agent: content-monitor
    emits: [violations]
