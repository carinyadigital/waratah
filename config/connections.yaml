# The connection registry.
#
# Keys are capability names agents declare in policy.connections.
# Provider names appear only here. R2 asserts declared connections exist;
# R10 prohibits any agent declaring a connection of kind "database".
#
# kind vocabulary: cms | code | chat | analytics | search | seo | email |
#                  observability | hosting | spreadsheet | database

connections:
  code:
    provider: github
    kind: code
    owner: jonno
    rotation:
      cadence: quarterly
      method: Fine-grained PAT re-issued in GitHub settings; stored as repo/org secret.

  cms:
    provider: payload
    kind: cms
    owner: jonno
    assertion:
      repo: carinyaparc/website
      testPath: apps/site/src/lib/payload/agent-publish.test.ts
      commitSha: 654236c232904172c9054c3333dfd64e91cc990f
    rotation:
      cadence: quarterly
      method: >-
        Rotate the agent user's API key in the Payload Admin UI
        (users → content-studio@agents.carinyaparc.com.au → regenerate API key),
        then update the CONTENT_AGENT_API_KEY secret in the managed-agent
        provider and in GitHub Actions. Disabling the key (enableAPIKey: false)
        stops the agent immediately; no other identity is affected
        (asserted by apps/site/src/lib/payload/agent-publish.test.ts in
        carinyaparc/website at the pinned commitSha above).
      revocation: Disable enableAPIKey on the agent user. Effect is immediate.

  chat:
    provider: slack
    kind: chat
    owner: jonno
    rotation:
      cadence: yearly
      method: Reinstall the Slack app to refresh the bot token.

  spreadsheet:
    provider: sheets
    kind: spreadsheet
    owner: jonno
    rotation:
      cadence: yearly
      method: Rotate the service-account key in Google Cloud console.

  analytics:
    provider: ga4
    kind: analytics
    owner: jonno
    rotation:
      cadence: yearly
      method: Rotate the service-account key in Google Cloud console.

  search:
    provider: gsc
    kind: search
    owner: jonno
    rotation:
      cadence: yearly
      method: Rotate the service-account key in Google Cloud console.

  seo:
    provider: ahrefs
    kind: seo
    owner: jonno
    rotation:
      cadence: yearly
      method: Regenerate the API token in the Ahrefs dashboard.

  esp:
    provider: tbd
    kind: email
    owner: jonno
    rotation:
      cadence: quarterly
      method: Regenerate the ESP API key; update provider secrets.

  observability:
    provider: sentry
    kind: observability
    owner: jonno
    rotation:
      cadence: yearly
      method: Rotate the auth token in Sentry settings.

  hosting:
    provider: vercel
    kind: hosting
    owner: jonno
    rotation:
      cadence: yearly
      method: Rotate the deploy token in Vercel settings.
